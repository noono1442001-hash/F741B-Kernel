name: Build Official Samsung Z Flip 6 (SM-F741B) KSU-Next + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu zip curl dwarves rsync python3 git make libarchive-tools

      - name: Download Official Samsung Source from Release
        run: |
          curl -L -o SM-F741B_15_Opensource.zip "https://github.com/${{ github.repository }}/releases/download/source/SM-F741B_15_Opensource.zip"
          unzip -q SM-F741B_15_Opensource.zip
          tar -zxf Kernel.tar.gz
          rm -f SM-F741B_15_Opensource.zip Kernel.tar.gz

      - name: Download AOSP Clang 17.0.2 (r487747c)
        run: |
          mkdir -p kernel_platform/prebuilts/clang/host/linux-x86/clang-r487747c
          curl -L "https://kali.download/nethunter-images/toolchains/clang-r487747c.tar.gz" | tar -zx -C kernel_platform/prebuilts/clang/host/linux-x86/clang-r487747c/

      - name: Integrate KernelSU-Next
        run: |
          cd kernel_platform/common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Integrate SUSFS
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 susfs
          cd kernel_platform/common
          cp ../../susfs/kernel_patches/fs/* fs/
          cp ../../susfs/kernel_patches/include/linux/* include/linux/
          patch -p1 < ../../susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch || true
          patch -p1 -d drivers/kernelsu < ../../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true

      - name: Enable KSU & SUSFS Configs in GKI defconfig
        run: |
          cd kernel_platform/common
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> arch/arm64/configs/gki_defconfig

      - name: Execute Samsung Official Build Script
        run: |
          chmod +x build_kernel_GKI.sh
          ./build_kernel_GKI.sh

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/BLOCK=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=boot;/g' AnyKernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          sed -i 's/dump_boot;/split_boot;/g' AnyKernel3/anykernel.sh
          sed -i 's/write_boot;/flash_boot;/g' AnyKernel3/anykernel.sh
          
          # Find output Image
          find out/ -name "Image" -exec cp {} AnyKernel3/ \;
          cd AnyKernel3
          zip -r9 ../SM-F741B-OneUI7-KSU-Next-SUSFS-Official.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-F741B-OneUI7-KSU-Next-SUSFS-Official
          path: SM-F741B-OneUI7-KSU-Next-SUSFS-Official.zip
