name: Build SM-F741B KernelSU-Next + Wild SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Giải phóng dung lượng ổ đĩa Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Cài đặt đầy đủ thư viện build
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libncurses5-dev libsdl1.2-dev libssl-dev libelf-dev dwarves pkg-config libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 cpio aria2 lz4 zstd

      - name: Tải và giải nén Kernel Source SM-F741B
        run: |
          mkdir -p src && cd src
          aria2c -x 16 -s 16 "https://github.com/noono1442001-hash/F741B-Kernel/releases/download/v1.0/SM-F741B_15_Opensource.zip" -o source.zip
          unzip -q source.zip
          rm -f source.zip
          for f in *.tar.gz; do [ -f "$f" ] && tar -xzf "$f" && rm -f "$f"; done

      - name: Tải Clang Toolchain (ZyC Clang)
        run: |
          mkdir -p toolchain/clang
          CLANG_URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | grep "browser_download_url.*tar.gz" | cut -d '"' -f 4 | head -n 1)
          aria2c -x 16 -s 16 "$CLANG_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain/clang
          rm -f clang.tar.gz

      - name: Tích hợp KernelSU-Next & WildKernels SUSFS Patches
        run: |
          KDIR="$GITHUB_WORKSPACE/src/kernel_platform/common"
          [ ! -d "$KDIR" ] && KDIR=$(find "$GITHUB_WORKSPACE/src" -maxdepth 4 -name "gki_defconfig" | sed 's|/arch/arm64/configs/gki_defconfig||' | head -n 1)
          echo "KDIR=$KDIR" >> $GITHUB_ENV
          cd "$KDIR"

          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/wild_patches
          SUSFS_PATCH=$(find /tmp/wild_patches -name "50_add_susfs_in_gki-android14-6.1.patch" | head -n 1)
          [ -z "$SUSFS_PATCH" ] && SUSFS_PATCH=$(find /tmp/wild_patches -name "*susfs*android14-6.1*.patch" | head -n 1)
          echo "Found SUSFS patch: $SUSFS_PATCH"

          if [ -d "KernelSU-Next" ]; then
            patch -d KernelSU-Next -p1 --forward --fuzz=3 < "$SUSFS_PATCH" || true
          fi
          patch -p1 --forward --fuzz=3 < "$SUSFS_PATCH" || true

          KSU_SUSFS_PATCH=$(find /tmp/wild_patches -name "*kernelsu*susfs*.patch" -o -name "*ksu*susfs*.patch" | head -n 1)
          if [ -n "$KSU_SUSFS_PATCH" ] && [ -d "KernelSU-Next" ]; then
            patch -d KernelSU-Next -p1 --forward --fuzz=3 < "$KSU_SUSFS_PATCH" || true
          fi

          find /tmp/wild_patches -path "*android14-6.1*" -name "*.c" -exec cp -n {} fs/ \; 2>/dev/null || true
          find /tmp/wild_patches -path "*android14-6.1*" -name "*.h" -exec cp -n {} include/linux/ \; 2>/dev/null || true

      - name: Cấu hình Samsung (Tắt RKP/UH/DEFEX & Bật KSU + SUSFS)
        run: |
          cd "$KDIR"
          BASE_DEFCONFIG="arch/arm64/configs/gki_defconfig"
          [ ! -f "$BASE_DEFCONFIG" ] && BASE_DEFCONFIG=$(find arch/arm64/configs -maxdepth 2 -name "*defconfig" | head -n 1)

          ./scripts/config --file "$BASE_DEFCONFIG" \
            -d UH \
            -d UH_RKP \
            -d UH_LKMAUTH \
            -d UH_LKM_BLOCK \
            -d RKP_CFP_JOPP \
            -d SECURITY_DEFEX \
            -d PROCA \
            -d FIVE \
            -d DEBUG_INFO_BTF \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT

      - name: Biên dịch Kernel (Image)
        run: |
          set -o pipefail
          cd "$KDIR"
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          BASE_NAME=$(find arch/arm64/configs -maxdepth 1 -name "gki_defconfig" -exec basename {} \; | head -n 1)
          [ -z "$BASE_NAME" ] && BASE_NAME=$(find arch/arm64/configs -maxdepth 2 -name "*defconfig" | sed 's|arch/arm64/configs/||' | head -n 1)

          FRAGS=$(find arch/arm64/configs -type f \( -name "*pineapple*.config" -o -name "*b6q*.config" \) | sed 's|arch/arm64/configs/||' | sort | tr '\n' ' ')
          echo "Building with: $BASE_NAME $FRAGS"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++ $BASE_NAME $FRAGS
          if ! make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++ Image 2>&1 | tee build.log; then
            echo "=== BUILD FAILED - PRINTING ERRORS ==="
            grep -iE "error:|fatal error:|undefined reference" build.log | tail -n 30
            exit 1
          fi

      - name: Đóng gói và Upload file Image thành phẩm
        uses: actions/upload-artifact@v4
        with:
          name: SM-F741B-KSU-Next-Wild-SUSFS
          path: ${{ env.KDIR }}/out/arch/arm64/boot/Image
