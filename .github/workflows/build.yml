name: Build Samsung Z Flip 6 Official Bazel (Audio + WiFi + BT + KSU + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Setup Swap (25GB cho Bazel & LTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 25

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu zip curl dwarves rsync python3 python-is-python3 git make libarchive-tools openjdk-11-jdk

      - name: Clone Samsung Official Kernel Tree (WildKernels SM-F741B)
        run: |
          git clone --depth 1 -b SM-F741B-Oneui8 --single-branch https://github.com/WildKernels/Samsung_Kernels.git kernel

      - name: Extract all prebuilt archives
        run: |
          cd kernel
          find . -type f -name '*.tar.xz' -print0 | while IFS= read -r -d '' file; do
            echo "Extracting $file"
            tar -xf "$file"
            rm "$file"
          done

      - name: Fix Exact Stock Vermagic (6.1.99-android14-11-30958522-abF7410ZSS2BYF3)
        run: |
          cd kernel
          # Sublevel chuẩn xác từ boot.img gốc là 99 (6.1.99)
          sed -i 's/SUBLEVEL = .*/SUBLEVEL = 99/' kernel_platform/common/Makefile
          sed -i 's/BUILD_NUMBER=.*/BUILD_NUMBER=F7410ZSS2BYF3/' build_kernel_GKI.sh
          # Ép chuỗi vermagic khớp 100% từng byte với boot.img gốc: 6.1.99-android14-11-30958522-abF7410ZSS2BYF3
          sed -i "$ s/.*/echo \"-android14-11-30958522-abF7410ZSS2BYF3\"/" kernel_platform/common/scripts/setlocalversion

      - name: Integrate KernelSU-Next
        run: |
          cd kernel/kernel_platform/common
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

      - name: Integrate SUSFS
        run: |
          cd kernel
          git clone --depth 1 -b gki-android14-6.1 --single-branch https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          cd kernel_platform/common
          cp ../../susfs4ksu/kernel_patches/fs/* fs/
          cp ../../susfs4ksu/kernel_patches/include/linux/* include/linux/
          cp ../../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./

          # Chuẩn bị file trước khi vá SUSFS (tránh xung đột mã nguồn Samsung)
          sed -i '/#ifdef CONFIG_SECURITY_DEFEX/,/^#endif/d' fs/open.c
          sed -i '/#include "internal.h"/a #include <trace/hooks/blk.h>' fs/namespace.c
          sed -i '/copy_flags = CL_COPY_UNBINDABLE | CL_EXPIRE;/,/#endif/ {
           /#ifdef CONFIG_KDP_NS/,/#endif/ {
              /#else/,/#endif/!d
              /#else/d
              /#endif/d
           }
          }' fs/namespace.c

          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || true
          sed -i '/#include <trace\/hooks\/blk.h>/d' fs/namespace.c
          rm -f 50_add_susfs_in_gki-android14-6.1.patch

      - name: Integrate NoMount
        run: |
          cd kernel/kernel_platform/common
          curl -sL https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -

      - name: Configure Defconfig & Fix User Space Freezing
        run: |
          cd kernel
          COMMON="kernel_platform/common"
          GKI_DEFCONFIG="$COMMON/arch/arm64/configs/gki_defconfig"

          # Bật KernelSU & SuSFS
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU_SUSFS
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU_SUSFS_SUS_PATH
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG

          # Bật tmpfs xattr & overlay để One UI 7 không bị đơ/sập vì lỗi "hệ thống người dùng"
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_OVERLAY_FS
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_TMPFS_XATTR
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_TMPFS_POSIX_ACL
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_NOMOUNT
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_USER_NS
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_PID_NS
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_IPC_NS
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_DEVTMPFS

          # Tắt cơ chế chặn root của Samsung Knox / RKP / Defex
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_KDP
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_RKP
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_DEFEX
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT

          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_UH
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_UH_RKP
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_UH_LKMAUTH
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_UH_LKM_BLOCK
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_RKP
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_RKP_CFP_JOPP
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_RKP_CFP_ROPP
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_RKP_CFP
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_SECURITY_DEFEX
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_SECURITY_DEFEX_USER
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_SECURITY_DEFEX_DTM
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_SECURITY_DEFEX_IMR
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_PROCA
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_PROCA_S_OS
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_PROCA_CERTIFICATES_DB
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_FIVE
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KDP
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KDP_NS
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KNOX_NCM

          # Bỏ check_defconfig để không bị dừng build
          sed -i 's/check_defconfig//' "$COMMON/build.config.gki"

      - name: Build Official Samsung Kernel via Bazel
        run: |
          cd kernel
          chmod +x build_kernel_GKI.sh
          chmod +x kernel_platform/tools/bazel 2>/dev/null || true
          chmod +x kernel_platform/build/kernel/kleaf/bazel.sh 2>/dev/null || true
          ./build_kernel_GKI.sh || true

      - name: Package AnyKernel3 & Odin boot.tar
        run: |
          cd kernel
          KERNEL_IMAGE=$(find . -name "Image" -type f | grep -E "dist|mixed_tree|bazel-bin" | head -n 1)
          if [ -z "$KERNEL_IMAGE" ]; then
            KERNEL_IMAGE=$(find . -name "Image" -type f | head -n 1)
          fi
          echo "Selected Image: $KERNEL_IMAGE"
          ls -lh "$KERNEL_IMAGE"

          # 1. Đóng gói AnyKernel3 ZIP
          git clone https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 AnyKernel3
          cp "$KERNEL_IMAGE" AnyKernel3/Image
          cd AnyKernel3
          zip -r9 ../../SM-F741B-OneUI7-6.1.99-KSU-Next-SUSFS-AnyKernel3.zip * -x .git README.md
          cd ..

          # 2. Đóng gói boot.img (Header v4) và boot.tar cho Odin
          python3 -c "
          import os, struct
          kernel_path = '$KERNEL_IMAGE'
          kernel_size = os.path.getsize(kernel_path)
          header = bytearray(4096)
          header[0:8] = b'ANDROID!'
          struct.pack_into('<I', header, 8, kernel_size)
          struct.pack_into('<I', header, 12, 0)
          header[16:20] = bytes.fromhex('9601001c')
          struct.pack_into('<I', header, 20, 1584)
          struct.pack_into('<I', header, 40, 4)
          with open('../boot.img', 'wb') as f_out:
              f_out.write(header)
              with open(kernel_path, 'rb') as f_k:
                  f_out.write(f_k.read())
              pad = (4096 - (kernel_size % 4096)) % 4096
              f_out.write(b'\x00' * pad)
              current_pos = f_out.tell()
              if current_pos < 100663296:
                  f_out.write(b'\x00' * (100663296 - current_pos))
          "
          cd ..
          tar -cf boot.tar boot.img

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-F741B-OneUI7-6.1.99-KSU-SUSFS-Build
          path: |
            SM-F741B-OneUI7-6.1.99-KSU-Next-SUSFS-AnyKernel3.zip
            boot.tar
